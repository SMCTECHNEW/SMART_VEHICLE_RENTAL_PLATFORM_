<script>

        const API_BASE_URL =
                "https://smart-vehicle-rental-platform-tbdq.onrender.com";


        const loginForm =
                document.getElementById(
                        "loginForm"
                );


        const loginMessage =
                document.getElementById(
                        "loginMessage"
                );



        function showMessage(
                message,
                type
        ) {

                if (
                        loginMessage
                ) {

                        loginMessage.textContent =
                                message;

                        loginMessage.className =
                                `login-message ${type}`;

                }

        }



        loginForm.addEventListener(
                "submit",
                async function (event) {

                        event.preventDefault();


                        const email =
                                document.getElementById(
                                        "email"
                                ).value.trim();


                        const password =
                                document.getElementById(
                                        "password"
                                ).value;


                        if (
                                !email ||
                                !password
                        ) {

                                showMessage(
                                        "Please enter email and password.",
                                        "error"
                                );

                                return;

                        }


                        try {

                                const formData =
                                        new URLSearchParams();


                                formData.append(
                                        "username",
                                        email
                                );


                                formData.append(
                                        "password",
                                        password
                                );


                                const response =
                                        await fetch(
                                                `${API_BASE_URL}/auth/login`,
                                                {

                                                        method:
                                                                "POST",

                                                        headers: {

                                                                "Content-Type":
                                                                        "application/x-www-form-urlencoded"

                                                        },

                                                        body:
                                                                formData

                                                }
                                        );


                                const result =
                                        await response.json();


                                if (!response.ok) {

                                        throw new Error(
                                                result.detail ||
                                                "Login failed"
                                        );

                                }


                                localStorage.setItem(
                                        "access_token",
                                        result.access_token
                                );


                                localStorage.setItem(
                                        "token",
                                        result.access_token
                                );


                                showMessage(
                                        "Login successful!",
                                        "success"
                                );


                                setTimeout(
                                        () => {

                                                window.location.href =
                                                        "../../index.html";

                                        },
                                        1000
                                );


                        } catch (error) {

                                console.error(
                                        error
                                );


                                showMessage(
                                        error.message ||
                                        "Login failed.",
                                        "error"
                                );

                        }

                }
        );

</script>
