<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Vehicle Rental</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="theme-toggle">
        <button id="themeToggleBtn" class="btn-icon">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="auth-container">
        <div class="auth-card glass-effect">
            <div class="auth-header">
                <h2>Forgot Password</h2>
                <p>Reset your password</p>
            </div>

            <!-- Step 1: Request Reset -->
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="john@example.com">
                    <span class="error-msg" id="emailError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="sendResetBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>

                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html" class="link">Login here</a></p>
                </div>
            </form>

            <!-- Step 2: Reset Password (hidden initially) -->
            <form id="resetPasswordForm" class="auth-form" style="display: none;">
                <input type="hidden" id="resetToken">
                
                <div class="form-group">
                    <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" name="newPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('newPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="newPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword"><i class="fas fa-lock"></i> Confirm New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="confirmNewPassword" name="confirmNewPassword" required placeholder="••••••••">
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmNewPassword')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="confirmNewPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="resetPasswordBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>

            <div id="successMessage" class="success-box" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <p>Password reset successfully! You can now login with your new password.</p>
                <a href="login.html" class="btn btn-primary btn-block">Go to Login</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
